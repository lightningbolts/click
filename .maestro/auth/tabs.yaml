appId: compose.project.click.click
name: Authenticated tab smoke
tags:
  - auth
---
- launchApp:
    appId: compose.project.click.click
    clearState: true
    permissions:
      all: allow
- runFlow:
    file: ../subflows/login.yaml
- extendedWaitUntil:
    visible:
      id: "nav-home"
    timeout: 30000
- tapOn:
    id: "nav-clicks"
- tapOn:
    id: "nav-map"
- tapOn:
    id: "nav-settings"
- tapOn:
    id: "nav-home"
- assertVisible:
    id: "nav-home"
- assertNotVisible:
    id: "onboarding-avatar"
- assertNotVisible: "Let's get started"
- tapOn:
    id: "nav-map"
- assertVisible:
    id: "map-screen"
- tapOn:
    id: "nav-home"
