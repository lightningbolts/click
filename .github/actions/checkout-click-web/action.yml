name: Checkout click-web source of truth
description: Check out lightningbolts/click-web main as the shared source of truth.

inputs:
  token:
    description: Token with read access to lightningbolts/click-web
    required: true
  path:
    description: Destination path relative to github.workspace
    required: false
    default: _click-web

runs:
  using: composite
  steps:
    - name: Checkout click-web
      uses: actions/checkout@v4
      with:
        repository: lightningbolts/click-web
        ref: main
        path: ${{ inputs.path }}
        fetch-depth: 0
        token: ${{ inputs.token }}
        persist-credentials: false
