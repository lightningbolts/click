name: Android Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLICK_WEB_ROOT: ${{ github.workspace }}/_click-web
      REQUIRE_CLICK_WEB: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require click-web read token
        env:
          CLICK_WEB_READ_TOKEN: ${{ secrets.CLICK_WEB_READ_TOKEN || github.token }}
        run: |
          test -n "$CLICK_WEB_READ_TOKEN" || {
            echo "CLICK_WEB_READ_TOKEN must grant read access to lightningbolts/click-web."
            exit 1
          }

      - name: Checkout click-web Supabase source of truth
        uses: ./.github/actions/checkout-click-web
        with:
          token: ${{ secrets.CLICK_WEB_READ_TOKEN || github.token }}
          candidate_ref: ${{ github.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            echo "GitHub runner Android SDK not found (ANDROID_SDK_ROOT/ANDROID_HOME)."
            exit 1
          fi
          sdkmanager_bin=""
          for candidate in \
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "$sdk_root/cmdline-tools"/*/bin/sdkmanager \
            "$sdk_root/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              sdkmanager_bin="$candidate"
              break
            fi
          done
          if [ -z "$sdkmanager_bin" ]; then
            echo "sdkmanager not found in preinstalled SDK: $sdk_root"
            find "$sdk_root" -maxdepth 4 -name sdkmanager -print || true
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          "$sdkmanager_bin" --version

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          [ -d "$ANDROID_SDK_ROOT/platforms/android-36" ] || packages+=("platforms;android-36")
          [ -d "$ANDROID_SDK_ROOT/build-tools/35.0.0" ] || packages+=("build-tools;35.0.0")
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "Required Android SDK packages are already present on the runner."
            exit 0
          fi
          for attempt in 1 2 3; do
            if sdkmanager "${packages[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "sdkmanager failed after 3 attempts: ${packages[*]}"
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$ANDROID_KEY_ALIAS" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "$ANDROID_KEY_PASSWORD" ] && missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            echo
            echo "Add them under Settings → Secrets and variables → Actions, or run locally:"
            echo "  gh auth login"
            echo "  ./scripts/setup-github-secrets.sh"
            echo
            echo "Manual ANDROID_KEYSTORE_BASE64:"
            echo "  base64 -w0 composeApp/keystore/release.jks"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"

      - name: Release quality checks
        run: |
          ./gradlew spotlessCheck :composeApp:testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace
          bash scripts/check-supabase-drift.sh
          bash scripts/test_map_beacons_hub_id.sh

      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease --no-daemon --stacktrace

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: click-release-aab
          path: composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30