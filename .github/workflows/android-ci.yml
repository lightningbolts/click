name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLICK_WEB_ROOT: ${{ github.workspace }}/_click-web
      REQUIRE_CLICK_WEB: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Spotless ratchetFrom("origin/main") needs full history / base ref.
          fetch-depth: 0
          persist-credentials: false

      - name: Require click-web read token
        env:
          CLICK_WEB_READ_TOKEN: ${{ secrets.CLICK_WEB_READ_TOKEN }}
        run: |
          test -n "$CLICK_WEB_READ_TOKEN" || {
            echo "CLICK_WEB_READ_TOKEN must grant read access to lightningbolts/click-web."
            exit 1
          }

      - name: Checkout click-web Supabase source of truth
        uses: actions/checkout@v4
        with:
          repository: lightningbolts/click-web
          # Pull requests validate against the matching web branch; main pushes use main.
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          path: _click-web
          fetch-depth: 0
          token: ${{ secrets.CLICK_WEB_READ_TOKEN }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Spotless (ktlint, ratchet from origin/main)
        run: ./gradlew spotlessCheck --no-daemon --no-configuration-cache --stacktrace

      - name: Unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon --stacktrace

      - name: Supabase drift check (vs sibling click-web)
        run: bash scripts/check-supabase-drift.sh

      - name: Source-of-truth event-hub migration test
        run: bash scripts/test_map_beacons_hub_id.sh

      - name: Production security constants and logging guards
        run: bash scripts/check-production-security-guards.sh

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace
