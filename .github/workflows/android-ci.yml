name: Android CI

on:
  push:
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Spotless ratchetFrom("origin/main") needs full history / base ref.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Spotless (ktlint, ratchet from origin/main)
        run: ./gradlew spotlessCheck --no-daemon --no-configuration-cache --stacktrace

      - name: Unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon --stacktrace

      - name: Supabase drift check (vs sibling click-web)
        run: bash scripts/check-supabase-drift.sh
        continue-on-error: false

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace
