name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLICK_WEB_ROOT: ${{ github.workspace }}/_click-web
      REQUIRE_CLICK_WEB: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Spotless ratchetFrom("origin/main") needs full history / base ref.
          fetch-depth: 0
          persist-credentials: false

      - name: Require click-web read token
        env:
          CLICK_WEB_READ_TOKEN: ${{ secrets.CLICK_WEB_READ_TOKEN || github.token }}
        run: |
          test -n "$CLICK_WEB_READ_TOKEN" || {
            echo "CLICK_WEB_READ_TOKEN must grant read access to lightningbolts/click-web."
            exit 1
          }

      - name: Checkout click-web Supabase source of truth
        uses: ./.github/actions/checkout-click-web
        with:
          token: ${{ secrets.CLICK_WEB_READ_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu-latest already ships the Android command-line SDK. setup-android@v3
      # re-downloads legacy tools metadata before Gradle starts, which made every Android
      # workflow depend on a transient Google repository2.xml request. Reuse the runner SDK
      # and only download an actually-missing platform/build-tools package.
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            echo "GitHub runner Android SDK not found (ANDROID_SDK_ROOT/ANDROID_HOME)."
            exit 1
          fi
          sdkmanager_bin=""
          for candidate in \
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "$sdk_root/cmdline-tools"/*/bin/sdkmanager \
            "$sdk_root/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              sdkmanager_bin="$candidate"
              break
            fi
          done
          if [ -z "$sdkmanager_bin" ]; then
            echo "sdkmanager not found in preinstalled SDK: $sdk_root"
            find "$sdk_root" -maxdepth 4 -name sdkmanager -print || true
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          "$sdkmanager_bin" --version

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          [ -d "$ANDROID_SDK_ROOT/platforms/android-36" ] || packages+=("platforms;android-36")
          [ -d "$ANDROID_SDK_ROOT/build-tools/35.0.0" ] || packages+=("build-tools;35.0.0")
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "Required Android SDK packages are already present on the runner."
            exit 0
          fi
          for attempt in 1 2 3; do
            if sdkmanager "${packages[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "sdkmanager failed after 3 attempts: ${packages[*]}"
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Spotless (ktlint, ratchet from origin/main)
        run: ./gradlew spotlessCheck --no-daemon --no-configuration-cache --stacktrace

      - name: Unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon --stacktrace

      - name: Supabase drift check (vs sibling click-web)
        run: bash scripts/check-supabase-drift.sh

      - name: Source-of-truth event-hub migration test
        run: bash scripts/test_map_beacons_hub_id.sh

      - name: Production security constants and logging guards
        run: bash scripts/check-production-security-guards.sh

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace