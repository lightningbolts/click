# Free local release-validation smoke tests.
# iOS runs on a GitHub-hosted simulator; Android device execution stays local
# because GitHub-hosted runners do not provide nested virtualization. Nothing
# in this workflow uploads to Maestro Cloud.
# Smoke flows only (auth journeys stay local until a dedicated test user is configured).

name: Mobile Maestro Release Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to test
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: maestro-local-${{ github.ref }}-${{ github.sha }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Validate Android Maestro smoke flow definitions
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            files = Dir[".maestro/**/*.yaml"].sort
            abort "No Maestro YAML files found" if files.empty?
            files.each do |file|
              documents = YAML.load_stream(File.read(file))
              if file == ".maestro/config.yaml"
                config = documents.fetch(0)
                abort "#{file}: missing appId" unless config["appId"] == "compose.project.click.click"
                abort "#{file}: missing smoke flow pattern" unless config.fetch("flows").include?("smoke/*")
              else
                header, commands = documents
                abort "#{file}: expected flow header and command list" unless header.is_a?(Hash) && commands.is_a?(Array)
                abort "#{file}: wrong appId" unless header["appId"] == "compose.project.click.click"
                abort "#{file}: missing tags" unless header.fetch("tags", []).is_a?(Array)
              end
              puts "validated #{file}"
            end
          '
          echo "Android device execution is local-only; run scripts/maestro-smoke-android.sh on an accelerated device for release evidence."

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Build iOS Simulator app
        run: |
          xcodebuild build \
            -scheme iosApp \
            -project iosApp/iosApp.xcodeproj \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/derivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Locate Simulator .app
        id: app
        run: |
          APP=$(find derivedData -path '*Debug-iphonesimulator/click.app' -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "Could not find click.app under derivedData"
            find derivedData -name '*.app' -type d | head -50
            exit 1
          fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: Boot local iOS Simulator and run Maestro smoke flows
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone .*Shutdown/{print $2; exit}')
          test -n "$DEVICE_UDID" || {
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          }
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          maestro --platform ios --device "$DEVICE_UDID" test .maestro --include-tags smoke
