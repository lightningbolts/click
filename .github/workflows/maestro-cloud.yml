# Free Android release-validation checks.
# GitHub-hosted runners do not provide nested virtualization, so Android device
# execution remains local; this workflow builds the APK and validates Maestro
# smoke-flow definitions. iOS Maestro execution lives in ios-release-validation.yml.

name: Mobile Maestro Release Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maestro-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            echo "GitHub runner Android SDK not found (ANDROID_SDK_ROOT/ANDROID_HOME)."
            exit 1
          fi
          sdkmanager_bin=""
          for candidate in \
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "$sdk_root/cmdline-tools"/*/bin/sdkmanager \
            "$sdk_root/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              sdkmanager_bin="$candidate"
              break
            fi
          done
          if [ -z "$sdkmanager_bin" ]; then
            echo "sdkmanager not found in preinstalled SDK: $sdk_root"
            find "$sdk_root" -maxdepth 4 -name sdkmanager -print || true
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          "$sdkmanager_bin" --version

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          [ -d "$ANDROID_SDK_ROOT/platforms/android-36" ] || packages+=("platforms;android-36")
          [ -d "$ANDROID_SDK_ROOT/build-tools/35.0.0" ] || packages+=("build-tools;35.0.0")
          [ -x "$ANDROID_SDK_ROOT/platform-tools/adb" ] || packages+=("platform-tools")
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "Required Android SDK packages are already present on the runner."
            exit 0
          fi
          for attempt in 1 2 3; do
            if sdkmanager "${packages[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "sdkmanager failed after 3 attempts: ${packages[*]}"
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Validate Android Maestro smoke flow definitions
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            files = Dir[".maestro/**/*.yaml"].sort
            abort "No Maestro YAML files found" if files.empty?
            files.each do |file|
              documents = YAML.load_stream(File.read(file))
              if file == ".maestro/config.yaml"
                config = documents.fetch(0)
                abort "#{file}: missing appId" unless config["appId"] == "compose.project.click.click"
                abort "#{file}: missing smoke flow pattern" unless config.fetch("flows").include?("smoke/*")
              else
                header, commands = documents
                abort "#{file}: expected flow header and command list" unless header.is_a?(Hash) && commands.is_a?(Array)
                abort "#{file}: wrong appId" unless header["appId"] == "compose.project.click.click"
                abort "#{file}: missing tags" unless header.fetch("tags", []).is_a?(Array)
              end
              puts "validated #{file}"
            end
          '
          echo "Android device execution is local-only; run scripts/maestro-smoke-android.sh on an accelerated device for release evidence."