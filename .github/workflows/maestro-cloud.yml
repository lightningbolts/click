# Free local release-validation smoke tests.
# Runs on GitHub-hosted Android and iOS devices; it never uploads to Maestro Cloud.
# Smoke flows only (auth journeys stay local until a dedicated test user is configured).

name: Mobile Maestro Release Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to test
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: maestro-local-${{ github.ref }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-30;google_apis;x86_64"

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run local Maestro Android smoke flows
        env:
          ANDROID_AVD_NAME: maestro-api-30
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user-home
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | avdmanager create avd \
            --force \
            --name "$ANDROID_AVD_NAME" \
            --package "system-images;android-30;google_apis;x86_64" \
            --device pixel_2
          avdmanager list avd
          test -f "$ANDROID_AVD_HOME/$ANDROID_AVD_NAME.ini"
          adb start-server
          "$ANDROID_HOME/emulator/emulator" \
            -avd "$ANDROID_AVD_NAME" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -camera-back none > "$RUNNER_TEMP/maestro-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          if ! timeout 1200 adb -s emulator-5554 wait-for-device; then
            echo "Android emulator did not connect to adb within 20 minutes."
            adb devices || true
            tail -100 "$RUNNER_TEMP/maestro-emulator.log" || true
            exit 1
          fi
          timeout 900 bash -c '
            until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              sleep 5
            done
          '
          adb -s emulator-5554 shell input keyevent 82 || true
          adb -s emulator-5554 shell settings put global window_animation_scale 0 || true
          adb -s emulator-5554 shell settings put global transition_animation_scale 0 || true
          adb -s emulator-5554 shell settings put global animator_duration_scale 0 || true
          adb -s emulator-5554 install composeApp/build/outputs/apk/debug/composeApp-debug.apk
          maestro test .maestro --include-tags smoke

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Build iOS Simulator app
        run: |
          xcodebuild build \
            -scheme iosApp \
            -project iosApp/iosApp.xcodeproj \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/derivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Locate Simulator .app
        id: app
        run: |
          APP=$(find derivedData -path '*Debug-iphonesimulator/click.app' -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "Could not find click.app under derivedData"
            find derivedData -name '*.app' -type d | head -50
            exit 1
          fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: Boot local iOS Simulator and run Maestro smoke flows
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone .*Shutdown/{print $2; exit}')
          test -n "$DEVICE_UDID" || {
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          }
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          maestro --platform ios --device "$DEVICE_UDID" test .maestro --include-tags smoke
