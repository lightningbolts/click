# Required release-validation upload. Requires repository secrets:
#   MAESTRO_API_KEY, MAESTRO_PROJECT_ID
# Runs for main after merge and can be started manually before approving a release.
# Smoke flows only (auth journeys stay local until a dedicated test user is configured).

name: Mobile Maestro Release Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to upload
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: maestro-cloud-${{ github.ref }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Maestro Cloud secrets
        env:
          MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}
          MAESTRO_PROJECT_ID: ${{ secrets.MAESTRO_PROJECT_ID }}
        run: |
          if [ -z "$MAESTRO_API_KEY" ] || [ -z "$MAESTRO_PROJECT_ID" ]; then
            echo "Set MAESTRO_API_KEY and MAESTRO_PROJECT_ID repository secrets, then re-run."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: Upload to Maestro Cloud
        uses: mobile-dev-inc/action-maestro-cloud@v2.0.2
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: composeApp/build/outputs/apk/debug/*.apk
          workspace: .maestro
          include-tags: smoke
          name: click-android-${{ github.sha }}

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Maestro Cloud secrets
        env:
          MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}
          MAESTRO_PROJECT_ID: ${{ secrets.MAESTRO_PROJECT_ID }}
        run: |
          if [ -z "$MAESTRO_API_KEY" ] || [ -z "$MAESTRO_PROJECT_ID" ]; then
            echo "Set MAESTRO_API_KEY and MAESTRO_PROJECT_ID repository secrets, then re-run."
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Build iOS Simulator app
        run: |
          xcodebuild build \
            -scheme iosApp \
            -project iosApp/iosApp.xcodeproj \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/derivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Locate Simulator .app
        id: app
        run: |
          APP=$(find derivedData -path '*Debug-iphonesimulator/iosApp.app' -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "Could not find iosApp.app under derivedData"
            find derivedData -name '*.app' -type d | head -50
            exit 1
          fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: Upload to Maestro Cloud
        uses: mobile-dev-inc/action-maestro-cloud@v2.0.2
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: ${{ steps.app.outputs.path }}
          workspace: .maestro
          include-tags: smoke
          name: click-ios-${{ github.sha }}
