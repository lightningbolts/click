name: Recovery Chat Partition

on:
  push:
    branches: [feat/main-recovery-20260914]

permissions:
  contents: write

concurrency:
  group: recovery-chat-partition
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[chat-partition-autofix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: feat/main-recovery-20260914
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Apply focused recovery patch
        run: python3 scripts/recovery_chat_partition_patch.py

      - name: Apply repository formatting
        run: ./gradlew spotlessApply --no-daemon --no-configuration-cache --stacktrace

      - name: Commit recovery patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "click-recovery-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composeApp/src
          git commit -m "Partition chat rendering and unify hub keyboard [chat-partition-autofix]"
          git push origin HEAD:feat/main-recovery-20260914
