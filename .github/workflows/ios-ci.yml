name: iOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-tests:
    # Kotlin 2.3.x platform CoreLocation bindings autolink `_LocationEssentials`,
    # which only exists in the Xcode 26 / iOS 26 SDK. macos-14's latest-stable
    # is still Xcode 16.2 and fails at linkDebugTestIosSimulatorArm64.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CLICK_WEB_ROOT: ${{ github.workspace }}/_click-web
      REQUIRE_CLICK_WEB: "1"
      XCODE_DERIVED_DATA: ${{ github.workspace }}/derivedData-xcode

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require click-web read token
        env:
          CLICK_WEB_READ_TOKEN: ${{ secrets.CLICK_WEB_READ_TOKEN || github.token }}
        run: |
          test -n "$CLICK_WEB_READ_TOKEN" || {
            echo "CLICK_WEB_READ_TOKEN must grant read access to lightningbolts/click-web."
            exit 1
          }

      - name: Checkout click-web Supabase source of truth
        uses: actions/checkout@v4
        with:
          repository: lightningbolts/click-web
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          path: _click-web
          fetch-depth: 0
          token: ${{ secrets.CLICK_WEB_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Any Xcode 26.x ships `_LocationEssentials` required by Kotlin 2.3.x CoreLocation.
          xcode-version: "26"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Show toolchain
        run: |
          java -version
          xcodebuild -version
          xcrun simctl list devices available | head -40

      - name: Supabase drift check (vs click-web source of truth)
        run: |
          bash scripts/check-supabase-drift.sh
          bash scripts/test_map_beacons_hub_id.sh
          bash scripts/check-production-security-guards.sh

      - name: Compile Kotlin iOS simulator target
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace

      - name: iOS simulator unit / UI tests
        run: ./gradlew :composeApp:iosSimulatorArm64Test --no-daemon --stacktrace

      - name: Compile Kotlin iOS device target
        run: ./gradlew :composeApp:compileKotlinIosArm64 --no-daemon --stacktrace

      - name: Build complete iOS Debug simulator app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$XCODE_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build complete iOS Release simulator app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$XCODE_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build release-equivalent iOS device app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$XCODE_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
