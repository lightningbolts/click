name: iOS CI

on:
  push:
  pull_request:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-tests:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Show toolchain
        run: |
          java -version
          xcodebuild -version
          xcrun simctl list devices available | head -40

      - name: iOS simulator unit / UI tests
        run: ./gradlew :composeApp:iosSimulatorArm64Test --no-daemon --stacktrace
