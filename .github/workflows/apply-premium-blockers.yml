name: Apply premium blockers

on:
  push:
    branches:
      - feat/premium-polish-pass-20260913
    paths:
      - .github/workflows/apply-premium-blockers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/premium-polish-pass-20260913
          fetch-depth: 0

      - name: Apply bounded event-chat and Nearby gesture fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}\n--- needle ---\n{old}")
              path.write_text(text.replace(old, new, 1))

          event = Path("composeApp/src/commonMain/kotlin/compose/project/click/click/ui/screens/EventBeaconDetail.kt")
          replace_once(
              event,
              "import compose.project.click.click.events.canOpenEventHub // pragma: allowlist secret\n",
              "import compose.project.click.click.events.EventHubCtaState // pragma: allowlist secret\nimport compose.project.click.click.events.eventHubCtaState // pragma: allowlist secret\n",
          )
          replace_once(
              event,
              """    val checkedIn =
        engagementCheckedIn || directoryEntry?.currentUserCheckedIn == true
    val mutualsUnlocked = directoryEntry?.mutualsSectionUnlocked == true
""",
              """    val checkedIn =
        engagementCheckedIn || directoryEntry?.currentUserCheckedIn == true
    val eventHubId = displayBeacon.hubId ?: engagement?.hubId
    var eventChatHydrationExhausted by remember(displayBeacon.id) { mutableStateOf(false) }
    var eventChatRetryNonce by remember(displayBeacon.id) { mutableIntStateOf(0) }
    val eventChatState =
        eventHubCtaState(
            hubId = eventHubId,
            isCreator = isEventCreator,
            checkedIn = checkedIn,
            hasRsvp = currentUserSignedUp,
            hydrationExhausted = eventChatHydrationExhausted,
        )
    val mutualsUnlocked = directoryEntry?.mutualsSectionUnlocked == true
""",
          )
          replace_once(
              event,
              """    LaunchedEffect(displayBeacon.id, currentUserSignedUp, checkedIn) {
        viewModel.loadBeaconAttendeeDirectory(displayBeacon.id, forceRefresh = false)
    }
""",
              """    LaunchedEffect(displayBeacon.id, currentUserSignedUp, checkedIn) {
        viewModel.loadBeaconAttendeeDirectory(displayBeacon.id, forceRefresh = false)
    }

    LaunchedEffect(
        displayBeacon.id,
        eventHubId,
        currentUserSignedUp,
        isEventCreator,
        eventChatRetryNonce,
    ) {
        if (!eventHubId.isNullOrBlank() || (!isEventCreator && !currentUserSignedUp)) {
            eventChatHydrationExhausted = false
            return@LaunchedEffect
        }

        eventChatHydrationExhausted = false
        val retryDelaysMs = longArrayOf(0L, 450L, 1_100L)
        for (retryDelayMs in retryDelaysMs) {
            if (retryDelayMs > 0L) delay(retryDelayMs)
            viewModel.ensureEventBeaconDetail(displayBeacon.id, seed = displayBeacon)
            viewModel.loadBeaconEngagement(displayBeacon.id, forceRefresh = true)
            // Give both async fetches a bounded window to publish hub_id before the next attempt.
            delay(900L)
            val hydratedHubId =
                viewModel.mapBeacons.value.firstOrNull { it.id == displayBeacon.id }?.hubId
                    ?: viewModel.beaconEngagementById.value[displayBeacon.id]?.hubId
            if (!hydratedHubId.isNullOrBlank()) return@LaunchedEffect
        }
        eventChatHydrationExhausted = true
    }
""",
          )
          replace_once(
              event,
              """        val checkInLabel = eventCheckInCtaLabel(checkedIn = checkedIn, pending = checkInPending)
        val eventHubId = displayBeacon.hubId ?: engagement?.hubId
        val canOpenHub =
            canOpenEventHub(
                hubId = eventHubId,
                isCreator = isEventCreator,
                checkedIn = checkedIn,
                hasRsvp = currentUserSignedUp,
            )
        val checkInIsPrimary = !canOpenHub
""",
              """        val checkInLabel = eventCheckInCtaLabel(checkedIn = checkedIn, pending = checkInPending)
        val canOpenHub = eventChatState == EventHubCtaState.Open
        val eventChatActionable =
            eventChatState == EventHubCtaState.Open || eventChatState == EventHubCtaState.Retry
        // Check-in is contextual once RSVP owns event-chat access; it should not visually outrank RSVP/chat.
        val checkInIsPrimary = false
""",
          )
          replace_once(
              event,
              """        ClickButton(
            onClick = {
                val hubId = eventHubId ?: return@ClickButton
                if (!canOpenHub) return@ClickButton
                ChatDeepLinkManager.setPendingEventHub(
                    hubId = hubId,
                    title = displayBeacon.displayDynamicTitle(),
                    creatorId = displayBeacon.createdByUserId,
                )
                viewModel.clearSelection()
            },
            enabled = canOpenHub,
            modifier = Modifier.fillMaxWidth(),
            variant = if (canOpenHub) ClickButtonVariant.Primary else ClickButtonVariant.Secondary,
        ) {
            if (eventHubId.isNullOrBlank()) {
                CircularProgressIndicator(
                    modifier = Modifier.size(18.dp),
                    strokeWidth = 2.dp,
                    color = MaterialTheme.colorScheme.primary,
                )
                Spacer(modifier = Modifier.width(8.dp))
            } else {
                Icon(
                    imageVector = Icons.Filled.Chat,
                    contentDescription = null,
                    modifier = Modifier.size(20.dp),
                )
                Spacer(modifier = Modifier.width(8.dp))
            }
            Text(
                text =
                    when {
                        eventHubId.isNullOrBlank() -> "Preparing event chat…"
                        canOpenHub -> "Open event chat"
                        else -> "Check in to join event chat"
                    },
                fontWeight = FontWeight.SemiBold,
            )
        }
        if (!canOpenHub && !eventHubId.isNullOrBlank()) {
            Text(
                text = "The event chat unlocks after you check in at the event.",
                style = MaterialTheme.typography.bodySmall,
                color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.72f),
            )
        }
""",
              """        ClickButton(
            onClick = {
                when (eventChatState) {
                    EventHubCtaState.Retry -> {
                        eventChatHydrationExhausted = false
                        eventChatRetryNonce += 1
                    }
                    EventHubCtaState.Open -> {
                        val hubId = eventHubId ?: return@ClickButton
                        ChatDeepLinkManager.setPendingEventHub(
                            hubId = hubId,
                            title = displayBeacon.displayDynamicTitle(),
                            creatorId = displayBeacon.createdByUserId,
                        )
                        viewModel.clearSelection()
                    }
                    EventHubCtaState.Preparing,
                    EventHubCtaState.RequiresRsvp,
                    -> Unit
                }
            },
            enabled = eventChatActionable,
            modifier = Modifier.fillMaxWidth(),
            variant = if (canOpenHub) ClickButtonVariant.Primary else ClickButtonVariant.Secondary,
        ) {
            when (eventChatState) {
                EventHubCtaState.Preparing -> {
                    CircularProgressIndicator(
                        modifier = Modifier.size(18.dp),
                        strokeWidth = 2.dp,
                        color = MaterialTheme.colorScheme.primary,
                    )
                    Spacer(modifier = Modifier.width(8.dp))
                }
                EventHubCtaState.Retry -> {
                    Icon(
                        imageVector = Icons.Filled.Refresh,
                        contentDescription = null,
                        modifier = Modifier.size(20.dp),
                    )
                    Spacer(modifier = Modifier.width(8.dp))
                }
                else -> {
                    Icon(
                        imageVector = Icons.Filled.Chat,
                        contentDescription = null,
                        modifier = Modifier.size(20.dp),
                    )
                    Spacer(modifier = Modifier.width(8.dp))
                }
            }
            Text(
                text =
                    when (eventChatState) {
                        EventHubCtaState.Preparing -> "Preparing event chat…"
                        EventHubCtaState.Retry -> "Retry event chat"
                        EventHubCtaState.Open -> "Open event chat"
                        EventHubCtaState.RequiresRsvp -> "RSVP to join event chat"
                    },
                fontWeight = FontWeight.SemiBold,
            )
        }
        if (eventChatState == EventHubCtaState.RequiresRsvp) {
            Text(
                text = "RSVP to coordinate with the event chat before you arrive.",
                style = MaterialTheme.typography.bodySmall,
                color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.72f),
            )
        }
""",
          )
          replace_once(
              event,
              """                        viewModel.rsvpToBeacon(displayBeacon.id) { ok ->
                            if (!ok) {
                                rsvpError = viewModel.engagementSnackbar.value
                                    ?: "Could not update RSVP. Please try again."
                            }
                        }
""",
              """                        viewModel.rsvpToBeacon(displayBeacon.id) { ok ->
                            if (!ok) {
                                rsvpError = viewModel.engagementSnackbar.value
                                    ?: "Could not update RSVP. Please try again."
                            } else {
                                // Rebind all sources that can carry hub_id so chat unlocks without
                                // dismissing/reopening the event sheet.
                                viewModel.loadBeaconRsvp(displayBeacon.id, forceRefresh = true)
                                viewModel.loadBeaconEngagement(displayBeacon.id, forceRefresh = true)
                                viewModel.ensureEventBeaconDetail(displayBeacon.id, seed = displayBeacon)
                                eventChatHydrationExhausted = false
                                eventChatRetryNonce += 1
                            }
                        }
""",
          )
          replace_once(
              event,
              """                    variant = ClickButtonVariant.Secondary,
                ) {
                    Text(
                        text =
                            if (rsvpPending) {
""",
              """                    variant = ClickButtonVariant.Primary,
                ) {
                    Text(
                        text =
                            if (rsvpPending) {
""",
          )

          nearby = Path("composeApp/src/commonMain/kotlin/compose/project/click/click/ui/screens/MapDiscoveryLayout.kt")
          replace_once(
              nearby,
              "import androidx.compose.foundation.clickable\n",
              "import androidx.compose.foundation.clickable\nimport androidx.compose.foundation.gestures.detectVerticalDragGestures\n",
          )
          replace_once(
              nearby,
              "import androidx.compose.ui.graphics.graphicsLayer\n",
              "import androidx.compose.ui.graphics.graphicsLayer\nimport androidx.compose.ui.input.pointer.pointerInput\n",
          )
          replace_once(
              nearby,
              """                .background(clickCardSurface())
                .clickable(enabled = enabled, onClick = onClick)
                .padding(top = 7.dp, bottom = 10.dp, start = 16.dp, end = 16.dp),
""",
              """                .background(clickCardSurface())
                .pointerInput(enabled) {
                    if (!enabled) return@pointerInput
                    val openThresholdPx = 28.dp.toPx()
                    var accumulatedDrag = 0f
                    var opened = false
                    detectVerticalDragGestures(
                        onDragStart = {
                            accumulatedDrag = 0f
                            opened = false
                        },
                        onDragCancel = {
                            accumulatedDrag = 0f
                            opened = false
                        },
                        onDragEnd = {
                            accumulatedDrag = 0f
                            opened = false
                        },
                        onVerticalDrag = { change, dragAmount ->
                            accumulatedDrag += dragAmount
                            if (!opened && accumulatedDrag <= -openThresholdPx) {
                                opened = true
                                change.consume()
                                PlatformHapticsPolicy.lightImpact()
                                onClick()
                            }
                        },
                    )
                }
                .clickable(enabled = enabled, onClick = onClick)
                .padding(top = 7.dp, bottom = 10.dp, start = 16.dp, end = 16.dp),
""",
          )

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Create local.properties
        run: |
          cat <<EOF > local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          MAPS_API_KEY=dummy_key_for_ci
          EOF

      - name: Format Kotlin changes
        run: ./gradlew spotlessApply --no-daemon --no-configuration-cache

      - name: Run event hub unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon --no-configuration-cache

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composeApp/src/commonMain/kotlin/compose/project/click/click/ui/screens/EventBeaconDetail.kt \
                  composeApp/src/commonMain/kotlin/compose/project/click/click/ui/screens/MapDiscoveryLayout.kt
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 1
          fi
          git commit -m "fix: bound event chat hydration and add Nearby swipe"
          git push origin HEAD:feat/premium-polish-pass-20260913
