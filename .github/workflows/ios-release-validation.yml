# Post-merge iOS release validation.
# PR CI already runs simulator tests, device-target compilation, and a complete
# Debug Xcode build. These jobs add release-mode Kotlin/Native linking plus an
# end-to-end simulator smoke without rebuilding the full Release Xcode app twice.

name: iOS Release Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-simulator:
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'composeApp/build.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Link Release framework for iOS Simulator
        run: ./gradlew :composeApp:linkReleaseFrameworkIosSimulatorArm64 --no-daemon --stacktrace

  release-device:
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'composeApp/build.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Link Release framework for iOS device
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

  maestro-smoke:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'composeApp/build.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat <<EOF > local.properties
          MAPS_API_KEY=${MAPS_API_KEY:-dummy_key_for_ci}
          EOF

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Build iOS Simulator app
        run: |
          xcodebuild build \
            -scheme iosApp \
            -project iosApp/iosApp.xcodeproj \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/derivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Locate Simulator .app
        id: app
        run: |
          APP=$(find derivedData -path '*Debug-iphonesimulator/click.app' -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "Could not find click.app under derivedData"
            find derivedData -name '*.app' -type d | head -50
            exit 1
          fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: Boot local iOS Simulator and run Maestro smoke flows
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone .*Shutdown/{print $2; exit}')
          test -n "$DEVICE_UDID" || {
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          }
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          maestro --platform ios --device "$DEVICE_UDID" test .maestro --include-tags smoke
