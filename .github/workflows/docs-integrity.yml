name: Documentation Integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changed-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLICK_WEB_ROOT: ${{ github.workspace }}/_click-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require click-web read token
        env:
          CLICK_WEB_READ_TOKEN: ${{ secrets.CLICK_WEB_READ_TOKEN || github.token }}
        run: |
          test -n "$CLICK_WEB_READ_TOKEN" || {
            echo "CLICK_WEB_READ_TOKEN must grant read access to lightningbolts/click-web."
            exit 1
          }

      - name: Checkout click-web Supabase source of truth
        uses: ./.github/actions/checkout-click-web
        with:
          token: ${{ secrets.CLICK_WEB_READ_TOKEN || github.token }}

      - name: Verify source-of-truth migration delegate
        run: |
          test -f "$CLICK_WEB_ROOT/scripts/test_map_beacons_hub_id.sh" || {
            echo "click-web must provide scripts/test_map_beacons_hub_id.sh for the mobile delegate."
            exit 1
          }

      - name: Validate changed documentation links, script references, and security claims
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -n "$BASE_SHA" || {
            echo "A comparison base is required to validate changed documentation."
            exit 1
          }
          git cat-file -e "${BASE_SHA}^{commit}" || {
            echo "Documentation comparison base is unavailable: $BASE_SHA"
            exit 1
          }
          changed_docs="$RUNNER_TEMP/changed-docs.txt"
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- '*.md' > "$changed_docs"
          node - "$changed_docs" <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const changed = fs.readFileSync(process.argv[2], 'utf8')
            .split('\n').map((file) => file.trim()).filter(Boolean);
          if (changed.length === 0) {
            console.log('No changed Markdown files to validate.');
            process.exit(0);
          }

          const root = process.cwd();
          const failures = [];
          const forbiddenClaims = [
            /messages, photos, and files are encrypted on your device[\s\S]*we (?:can't|cannot) read them/i,
            /end-to-end encrypted[\s\S]*only you and your connection can read them/i,
          ];

          for (const file of changed) {
            if (!fs.existsSync(file)) continue;
            const contents = fs.readFileSync(file, 'utf8');
            for (const claim of forbiddenClaims) {
              if (claim.test(contents)) {
                failures.push(`${file}: contains a legacy E2EE claim that the current protocol does not support`);
              }
            }
            for (const match of contents.matchAll(/!?\[[^\]]*\]\(([^)]+)\)/g)) {
              let target = match[1].trim().split(/\s+/, 1)[0].replace(/^<|>$/g, '');
              if (!target || target.startsWith('#') || /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(target)) continue;
              target = target.split(/[?#]/, 1)[0];
              if (!target) continue;
              const resolved = path.resolve(path.dirname(file), target);
              if (resolved.startsWith(`${root}${path.sep}`) && !fs.existsSync(resolved)) {
                failures.push(`${file}: broken local link ${target}`);
              }
            }
            for (const match of contents.matchAll(/(?:^|\s)(?:bash|sh)\s+((?:\.\/)?scripts\/[A-Za-z0-9_./-]+\.sh)\b/gm)) {
              const script = match[1].replace(/^\.\//, '');
              if (!fs.existsSync(path.join(root, script))) {
                failures.push(`${file}: missing referenced script ${script}`);
              }
            }
          }

          if (failures.length > 0) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(`Validated ${changed.length} changed Markdown file(s).`);
          NODE
