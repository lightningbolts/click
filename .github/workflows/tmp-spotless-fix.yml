name: Temporary Spotless Fix

on:
  push:
    branches:
      - feat/premium-polish-pass-20260913

permissions:
  contents: write

jobs:
  apply-spotless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/premium-polish-pass-20260913
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Spotless formatting
        run: ./gradlew spotlessApply --no-daemon

      - name: Commit formatted sources and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-spotless-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git commit -m "style: apply Spotless formatting"
          git push origin HEAD:feat/premium-polish-pass-20260913
