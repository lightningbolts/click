name: Recovery Spotless Autofix

on:
  push:
    branches: [feat/main-recovery-20260914]

permissions:
  contents: write

concurrency:
  group: recovery-spotless-autofix
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[spotless-autofix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: feat/main-recovery-20260914
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Apply repository Kotlin formatting
        run: ./gradlew spotlessApply --no-daemon --no-configuration-cache --stacktrace

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- composeApp/src; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "click-recovery-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composeApp/src
          git commit -m "Apply Spotless formatting [spotless-autofix]"
          git push origin HEAD:feat/main-recovery-20260914
